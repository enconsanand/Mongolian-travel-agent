[project]
name = "fastapi-backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "bcrypt>=5.0.0",
    "fastapi>=0.139.0",
    "gunicorn>=26.0.0",
    "pre-commit>=4.6.2",
    "pydantic-settings>=2.14.2",
    "pydantic[email]>=2.13.4",
    "pymongo>=4.10",
    "python-jose>=3.5.0",
    "python-multipart>=0.0.32",
    "pytz>=2026.2",
    "redis>=8.0.1",
    "requests>=2.34.2",
    "uvicorn>=0.49.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "mongomock>=4.3",
    "mypy>=1.13.0",
    "pytest>=8.3.4",
    "pytest-cov>=6.0.0",
    "ruff>=0.15.20",
]

[tool.ruff]
line-length = 120
include = ["app/**/*.py", "app/**/*.pyi", "test/**/*.py", "test/**/*.pyi"]

[tool.ruff.lint]
select = ["E", "F", "I", "BLE", "SIM", "FURB"]

[tool.pytest.ini_options]
testpaths = ["test"]
pythonpath = ["."]
addopts = "--cov=app --cov-report=term-missing --cov-fail-under=70"

[tool.mypy]
python_version = "3.13"
files = ["app"]
plugins = ["pydantic.mypy"]
ignore_missing_imports = true
# Stacked @computed_field + @property is the documented Pydantic pattern but mypy
# flags it; this is a known mypy limitation, not a real error.
disable_error_code = ["prop-decorator"]
