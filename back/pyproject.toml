[project]
name = "fastapi-backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "bcrypt>=5.0.0",
    "cryptography>=46",
    "fastapi>=0.139.0",
    "gunicorn>=26.0.0",
    "httpx>=0.28.1",
    "pre-commit>=4.6.2",
    "pydantic-settings>=2.14.2",
    "pydantic[email]>=2.13.4",
    "pymongo>=4.10",
    "python-jose>=3.5.0",
    "python-multipart>=0.0.32",
    "pytz>=2026.2",
    "redis>=8.0.1",
    "requests>=2.34.2",
    "uvicorn>=0.49.0",
]

[dependency-groups]
dev = [
    "import-linter>=2.15",
    "mongomock>=4.3",
    "mypy>=1.13.0",
    "pytest>=8.3.4",
    "pytest-cov>=6.0.0",
    "ruff>=0.15.20",
]

[tool.ruff]
line-length = 120
include = ["app/**/*.py", "app/**/*.pyi", "test/**/*.py", "test/**/*.pyi"]

[tool.ruff.lint]
select = ["E", "F", "I", "BLE", "SIM", "FURB"]

[tool.pytest.ini_options]
testpaths = ["test"]
pythonpath = ["."]
addopts = "--cov=app --cov-report=term-missing --cov-fail-under=70"

[tool.mypy]
python_version = "3.13"
files = ["app"]
plugins = ["pydantic.mypy"]
ignore_missing_imports = true
# Stacked @computed_field + @property is the documented Pydantic pattern but mypy
# flags it; this is a known mypy limitation, not a real error.
disable_error_code = ["prop-decorator"]

# Module boundaries (run: `uv run lint-imports`). See the "Хамаарлын дүрэм" table in the architecture plan.
[tool.importlinter]
root_package = "app"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Only the orchestrator talks to LLMs"
type = "forbidden"
source_modules = [
    "app.modules.booking",
    "app.modules.payment",
    "app.modules.policy",
    "app.ap2",
    "app.services",
    "app.api",
]
forbidden_modules = ["app.llm"]
# The HTTP layer reaches the models only through the orchestrator (app.api -> orchestrator -> app.llm)
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "The LLM side never moves money: orchestrator must not use payment or AP2 directly"
type = "forbidden"
source_modules = ["app.modules.orchestrator", "app.llm"]
forbidden_modules = ["app.modules.payment", "app.ap2"]

[[tool.importlinter.contracts]]
name = "Deterministic core does not depend on the agent"
type = "forbidden"
source_modules = ["app.modules.booking", "app.modules.payment", "app.modules.policy", "app.ap2"]
forbidden_modules = ["app.modules.orchestrator"]

[[tool.importlinter.contracts]]
name = "Separate processes speak protocols, not module internals"
type = "forbidden"
source_modules = ["app.services"]
forbidden_modules = ["app.modules"]

[[tool.importlinter.contracts]]
name = "Nothing below the HTTP layer imports it"
type = "forbidden"
source_modules = ["app.modules", "app.ap2", "app.llm", "app.services", "app.db", "app.schemas", "app.crud"]
forbidden_modules = ["app.api"]

[[tool.importlinter.contracts]]
name = "AP2 is pure: no database or HTTP"
type = "forbidden"
source_modules = ["app.ap2"]
forbidden_modules = ["app.db", "app.crud", "pymongo", "requests", "httpx"]
allow_indirect_imports = true
