services:
  back:
    image: tmp_back:local
    build:
      context: .
      dockerfile: back/Dockerfile
      target: dev
    command: uvicorn app.main:app --host 0.0.0.0 --reload --port ${BACK_PORT:-8000}
    volumes:
      - ./back/:/app/
      - ./data/:/data/:ro
      - uv_cache:/root/.cache/uv
    env_file:
      - secret/.env
    # MongoDB: the app defaults to this compose file's `mongo` service; set MONGO_URI (and
    # MONGO_DB_NAME) in secret/.env to use Atlas instead
    environment:
      - MOCK_DATA_DIR=/data/mock
    ports:
      - "${BACK_PORT:-8000}:${BACK_PORT:-8000}"
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - network_back
      - network_front
    restart: unless-stopped

  # Single-node replica set: multi-document transactions and change streams (booking saga,
  # transactional outbox) only work on a replica set. The healthcheck initiates it on first start and
  # stays unhealthy until this node is a writable primary, so `back` never starts against a read-only node.
  mongo:
    image: mongo:8
    command: ["--replSet", "rs0", "--bind_ip_all"]
    healthcheck:
      test:
        - CMD
        - mongosh
        - --quiet
        - --eval
        - "try { rs.status() } catch (e) { rs.initiate({ _id: 'rs0', members: [{ _id: 0, host: 'mongo:27017' }] }) }; if (!db.hello().isWritablePrimary) quit(1)"
      interval: 5s
      timeout: 10s
      start_period: 10s
      retries: 20
    volumes:
      - db_data:/data/db
    ports:
      - "${MONGO_PORT:-27018}:27017"
    networks:
      - network_back
    restart: unless-stopped

  # Optional: enables distributed rate limiting across multiple workers/instances.
  # Set REDIS_URL=redis://redis:6379/0 in secret/.env to activate it; otherwise the
  # app falls back to an in-memory limiter.
  redis:
    image: redis:7-alpine
    command: redis-server --save "" --appendonly no
    networks:
      - network_back
    restart: unless-stopped

  # QPay Merchant V2 simulator (PAYMENT_RAIL=sim). Same image as back; controls at http://localhost:8010/_sim/docs
  qpay-sim:
    image: tmp_back:local
    build:
      context: .
      dockerfile: back/Dockerfile
      target: dev
    command: uvicorn app.services.qpay_sim:app --host 0.0.0.0 --port 8010 --reload
    environment:
      # The QR and bank deeplinks open the Sim Bank page here; use your LAN IP to pay by scanning with a phone
      QPAY_SIM_PUBLIC_URL: ${QPAY_SIM_PUBLIC_URL:-http://localhost:8010}
    volumes:
      - ./back/:/app/
      - uv_cache:/root/.cache/uv
    ports:
      - "${QPAY_SIM_PORT:-8010}:8010"
    networks:
      - network_back
    restart: unless-stopped

  front:
    image: tmp_front:local
    build:
      context: .
      dockerfile: front/Dockerfile
      target: dev
    volumes:
      - ./front/:/app/
      - node_modules:/app/node_modules
    env_file:
      - secret/.env
    command: pnpm run dev --port ${FRONT_PORT:-3000} --host 0.0.0.0
    ports:
      - "${FRONT_PORT:-3000}:${FRONT_PORT:-3000}"
    depends_on:
      - back
    networks:
      - network_front
    restart: unless-stopped

volumes:
  db_data:
  node_modules:
  uv_cache:

networks:
  network_back:
  network_front:
